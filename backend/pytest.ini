[pytest]
testpaths = tests
# The coverage gate is enforced by running the tests, not by a reviewer
# remembering to look. Every line of app/ is currently reached, so there is
# nothing excluded and nothing to justify.
addopts = -q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=100
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
