version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build" }
    groups:
      # A dependency lands in the first group it matches, so the narrow groups
      # come first and the catch-all below sweeps up what is left. Majors match
      # no group on purpose: they arrive one at a time, where a release note is
      # worth reading.
      backend-tooling:
        patterns: ["pytest*", "ruff", "httpx"]
        update-types: ["minor", "patch"]
      backend-runtime:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build" }
    groups:
      mantine: { patterns: ["@mantine/*"] }
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
      # vite and its react plugin peer-depend on each other, so a major in either
      # one alone cannot install: each pull request fails at `npm ci` against the
      # version of the other still on main. They have to arrive together.
      vite: { patterns: ["vite", "@vitejs/*"] }
      # Lint is one toolchain in practice -- eslint, its config package, its
      # plugins and the globals list only ever move together, and a rule change
      # is only reviewable with all of them in one diff.
      lint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "typescript-eslint", "globals"]
        update-types: ["minor", "patch"]
      # Everything the groups above do not claim: icons, markdown, postcss.
      # Majors fall through to their own pull request, typescript included.
      frontend-rest:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint refuses to load under TS 7.0 -- it throws on import, so
      # this is not a warning to work around. Support is tracked for TS >= 7.1 in
      # typescript-eslint#10940, and 7.1 is deliberately left un-ignored so the
      # bump comes back on its own once it can pass. The source itself already
      # typechecks clean under 7.0; lint is the only thing holding it.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    commit-message: { prefix: "test" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    groups:
      # Workflow action pins are one unit of review: they are read together in
      # one file and nothing here is version-coupled to the code.
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
